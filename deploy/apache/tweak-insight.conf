# ==============================================================================
# Tweak Insight Logistics - Apache 2.4 VirtualHost Configuration
# Target: /etc/apache2/sites-available/tweak-insight.conf
# Enable: a2ensite tweak-insight.conf && systemctl reload apache2
# Required Modules: proxy, proxy_fcgi, ssl, rewrite, headers, deflate
#   sudo a2enmod proxy proxy_fcgi ssl rewrite headers deflate
# ==============================================================================

# 1. HTTP to HTTPS Redirection
<VirtualHost *:80>
    ServerName logistics.tweakinsight.com
    ServerAlias www.logistics.tweakinsight.com
    ServerAdmin admin@tweakinsight.com

    DocumentRoot /var/www/tweak-insight-logistics/backend/public

    # Allow Let's Encrypt ACME challenges
    <Directory "/var/www/tweak-insight-logistics/backend/public/.well-known">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/til_error.log
    CustomLog ${APACHE_LOG_DIR}/til_access.log combined
</VirtualHost>

# 2. Main HTTPS Production Server
<VirtualHost *:443>
    ServerName logistics.tweakinsight.com
    ServerAlias www.logistics.tweakinsight.com
    ServerAdmin admin@tweakinsight.com

    DocumentRoot /var/www/tweak-insight-logistics/backend/public
    DirectoryIndex index.php index.html

    # SSL / TLS Modern Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/logistics.tweakinsight.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/logistics.tweakinsight.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Document Root Directory Permissions & Rewrites
    <Directory /var/www/tweak-insight-logistics/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to hidden dotfiles and sensitive directories
    <DirectoryMatch "^\.|\/\.">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "^/var/www/tweak-insight-logistics/backend/(storage|config|database|queue|helpers|tests)">
        Require all denied
    </DirectoryMatch>

    # Proxy API and Dynamic Traffic to PHP-FPM Socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Route backend endpoints through api.php
    <LocationMatch "^/(api|auth|admin|client|deliveries|delivery|delivery-person|notifications|health|payments)">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/var/www/tweak-insight-logistics/backend/public/api.php"
    </LocationMatch>

    # Global Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), camera=(self), microphone=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self';"

    # Caching Policy
    <FilesMatch "\.(css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    <FilesMatch "\.(html|htm)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate, max-age=0"
    </FilesMatch>

    # Gzip / Deflate Compression
    AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript application/json

    ErrorLog ${APACHE_LOG_DIR}/til_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/til_ssl_access.log combined
</VirtualHost>
