version: '3.8'

services:
  # ============================================================================
  # 1. PHP 8.2-FPM Backend
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: til_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html/backend
      - til_storage:/var/www/html/backend/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - til-network

  # ============================================================================
  # 2. Background Queue Worker Daemon
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: til_worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.worker.sh"]
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html/backend
      - til_storage:/var/www/html/backend/storage
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - til-network

  # ============================================================================
  # 3. Nginx Web Server & Frontend SPA Host
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: til_web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
      - "${SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./backend/storage/exports:/var/www/html/public/exports:ro
    depends_on:
      - backend
    networks:
      - til-network

  # ============================================================================
  # 4. MySQL 8 Database
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: til_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password_dev}
      MYSQL_DATABASE: ${DB_NAME:-tweak_insight_logistics}
      MYSQL_USER: ${DB_USER:-til_app}
      MYSQL_PASSWORD: ${DB_PASS:-til_secure_pass_dev}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    volumes:
      - til_db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER:-til_app}", "-p${DB_PASS:-til_secure_pass_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - til-network

  # ============================================================================
  # 5. Redis Cache, Broker & Rate Limiter
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: til_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - til_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - til-network

# ==============================================================================
# Persistent Volumes & Private Network
# ==============================================================================
volumes:
  til_db_data:
    driver: local
  til_redis_data:
    driver: local
  til_storage:
    driver: local

networks:
  til-network:
    driver: bridge
