# ==============================================================================
# Tweak Insight Logistics - Docker Nginx Virtual Host Configuration
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html/public;
    index index.html index.php;

    client_max_body_size 25M;
    server_tokens off;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self';" always;

    # Prevent access to hidden files and directory traversal
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to storage, documents, uploads
    location ~* ^/(?:storage|uploads|documents)/ {
        deny all;
        return 404;
    }

    # Static Assets with long-term caching
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Auth endpoints with stricter rate limiting
    location ~* ^/(?:api/)?auth/(?:login|register|refresh|forgot-password) {
        limit_req zone=til_auth_limit burst=10 nodelay;
        fastcgi_pass backend:9000;
        fastcgi_index api.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/api.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    # API endpoints routed through api.php
    location ~* ^/(?:api(?:/|$)|auth/|admin/|client/|deliveries/|delivery/|delivery-person/|notifications(?:/|$)|health(?:/|$)|payments/) {
        limit_req zone=til_api_limit burst=50 nodelay;
        fastcgi_pass backend:9000;
        fastcgi_index api.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/api.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    # Frontend Single Page App fallback
    location / {
        try_files $uri $uri/ /index.html /index.php?$query_string;
    }

    # Direct execution of arbitrary PHP scripts is denied
    location ~ \.php$ {
        deny all;
        return 404;
    }
}
