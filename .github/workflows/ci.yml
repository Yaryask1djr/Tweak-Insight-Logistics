name: CI Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Test Verification Suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tweak_insight_logistics_new
          MYSQL_USER: til_app
          MYSQL_PASSWORD: d02c1da7f8326c42c4945886aa2cabba9f13729a658112116b3f0cc2abdbde9a
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=6

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=6

    defaults:
      run:
        working-directory: backend
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, redis, curl, bcmath, json
          tools: composer:v2
          coverage: none

      - name: Initialize MySQL database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot tweak_insight_logistics_new < database/schema.sql

      - name: Configure test environment
        run: |
          cat << 'EOF' > .env
          APP_NAME="Tweak Insight Logistics"
          APP_ENV=testing
          BASE_URL=http://localhost:8000
          SERVER_PORT=8000
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=tweak_insight_logistics_new
          DB_USER=til_app
          DB_PASS=d02c1da7f8326c42c4945886aa2cabba9f13729a658112116b3f0cc2abdbde9a
          JWT_SECRET=5e04becaf2838e9f8fb1cb5b53e9e6c09d094ec9eba68429d3b66f2c253a7ce5
          STORAGE_PATH=storage
          QUEUE_DRIVER=mysql
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          QUEUE_TEST_REDIS_PORT=6379
          SMS_PROVIDER=log
          WHATSAPP_PROVIDER=log
          EOF

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.json') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHP syntax across backend
        run: find . -path ./vendor -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Run Core Verification Suites
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: tweak_insight_logistics_new
          DB_USER: til_app
          DB_PASS: d02c1da7f8326c42c4945886aa2cabba9f13729a658112116b3f0cc2abdbde9a
          QUEUE_TEST_REDIS_PORT: 6379
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          set -e
          test_suites=(
            "tests/verify_authorization_policy.php"
            "tests/verify_broadcast_batching.php"
            "tests/verify_client_ip_resolution.php"
            "tests/verify_cors_policy.php"
            "tests/verify_credential_configuration.php"
            "tests/verify_decoupled_scaling.php"
            "tests/verify_document_storage_security.php"
            "tests/verify_integration_contracts.php"
            "tests/verify_job_queue.php"
            "tests/verify_kano_address_validation.php"
            "tests/verify_kpi_caching.php"
            "tests/verify_notification_catalog.php"
            "tests/verify_operations_workflow.php"
            "tests/verify_pending_deliverymen_query.php"
            "tests/verify_rate_limiter_proxy.php"
            "tests/verify_spatial_geofencing.php"
            "tests/verify_telemetry_isolation.php"
            "tests/verify_telemetry_redis_streaming.php"
            "tests/verify_external_notification_gateway.php"
            "tests/verify_tracking_privacy.php"
            "tests/verify_worker_daemon.php"
          )
          for suite in "${test_suites[@]}"; do
            echo "::group::Running $suite"
            php -d zend.assertions=1 -d assert.exception=1 "$suite"
            echo "::endgroup::"
          done

  frontend-checks:
    name: Frontend Build & Type Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Compile production frontend build
        run: npm run build
