[program:til-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/tweak-insight-logistics/backend/scripts/queue_worker.php --queue=default --sleep=2 --memory-limit=128 --max-jobs=1000
directory=/var/www/tweak-insight-logistics/backend
autostart=true
autorestart=true
startretries=10
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/til-queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
stopasgroup=true
priority=999
