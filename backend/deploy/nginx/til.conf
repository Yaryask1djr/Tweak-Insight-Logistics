# ==============================================================================
# Tweak Insight Logistics — Production Nginx Server Block
# Location: /etc/nginx/sites-available/til.conf
# Enable: ln -s /etc/nginx/sites-available/til.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=til_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=til_auth_limit:10m rate=5r/s;

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name logistics.tweakinsight.com www.logistics.tweakinsight.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logistics.tweakinsight.com;

    # SSL / TLS Certificates
    ssl_certificate /etc/letsencrypt/live/logistics.tweakinsight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.tweakinsight.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Document root MUST be backend/public (never backend root!)
    root /var/www/tweak-insight-logistics/backend/public;
    index index.html api.php;

    client_max_body_size 20M;
    server_tokens off;

    # Global Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Prevent access to hidden files and directory traversal
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to storage, documents, uploads if symlinked
    location ~* ^/(?:storage|uploads|documents)/ {
        deny all;
        return 404;
    }

    # Frontend Single Page App fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache HTML with no-cache so React updates are picked up instantly
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Static Assets (JS, CSS, Images, Fonts) with long-term immutable caching
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Auth endpoints with stricter rate limiting
    location ~* ^/(?:api/)?auth/(?:login|register|refresh|forgot-password) {
        limit_req zone=til_auth_limit burst=10 nodelay;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index api.php;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # API endpoints routed through api.php
    location ~* ^/(?:api/|auth/|admin/|client/|deliveries/|delivery/|delivery-person/|notifications/|health$) {
        limit_req zone=til_api_limit burst=50 nodelay;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index api.php;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    # Disallow direct execution of any other arbitrary PHP scripts
    location ~ \.php$ {
        deny all;
        return 404;
    }
}
